[project]
name = "data-quality-monitor"
version = "0.1.0"
description = "A lightweight data quality monitoring tool"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
# 安装后自动生成一个叫 dqm 的命令，指向 core/cli.py 里的 main 函数
dqm = "core.cli:main"

[build-system]
# pip 安装这个项目时用的构建工具和构建方式。
# [project.scripts] 的 dqm 命令能生效、pip install -e . 能成功，靠的都是这一段
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 显式声明要打包的目录，避免 setuptools 把 data/、notes/ 也当成包
[tool.setuptools.packages.find]
include = ["core*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]