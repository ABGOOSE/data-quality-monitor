[project]
name = "data-quality-monitor"
version = "0.1.0"
description = "A lightweight data quality monitoring tool"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    # 限制在 2.0.x：达梦 dmSQLAlchemy 方言包（2.0.17）不兼容 SQLAlchemy 2.1+
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
# 连接达梦数据库时额外安装：pip install -e ".[dm]"
# 注意：dmSQLAlchemy 方言包需从达梦安装目录源码安装，详见《达梦连接操作文档.md》
dm = [
    "dmPython",
]

[project.scripts]
# 安装后自动生成一个叫 dqm 的命令，指向 core/cli.py 里的 main 函数
dqm = "core.cli:main"

[build-system]
# pip 安装这个项目时用的构建工具和构建方式。
# [project.scripts] 的 dqm 命令能生效、pip install -e . 能成功，靠的都是这一段
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 显式声明要打包的目录，避免 setuptools 把 data/、notes/ 也当成包
[tool.setuptools.packages.find]
include = ["core*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# 个人学习日志（markdown 里的代码块）不参与代码规范检查
exclude = ["notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]